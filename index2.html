<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mensagem Especial ♥</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --cream: #fdf6ee;
      --blush: #e8c4b0;
      --rose: #c4806a;
      --deep: #6b3a2a;
      --gold: #c9a96e;
      --text: #3a2318;
      --muted: #9a7060;
      --dark: #1a0f0a;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Jost', sans-serif;
      background-color: var(--dark);
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      overflow-x: hidden;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      opacity: 0.5;
    }

    /* Ambient glow */
    body::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(196,128,106,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .page-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3rem;
      animation: fadeIn 1.2s ease both;
    }

    /* ─── HEADER ─── */
    .page-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    .eyebrow {
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: 0.7rem;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      line-height: 1.1;
      color: var(--cream);
    }
    .page-title em {
      font-style: italic;
      color: var(--blush);
    }

    .page-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 480px;
    }

    /* ─── DIVIDER ─── */
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 200px;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(201,169,110,0.4), transparent);
    }
    .divider-icon { color: var(--gold); font-size: 0.85rem; }

    /* ─── VIDEO CONTAINER ─── */
    .video-wrapper {
      width: 100%;
      position: relative;
      border-radius: 3px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(201,169,110,0.15),
        0 40px 100px rgba(0,0,0,0.6),
        0 8px 24px rgba(0,0,0,0.4);
    }

    /* 16:9 aspect ratio */
    .video-ratio {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
    }

    .video-ratio iframe,
    .video-ratio video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Gold frame accent */
    .video-wrapper::before {
      content: '';
      position: absolute;
      inset: -1px;
      border: 1px solid rgba(201,169,110,0.2);
      border-radius: 3px;
      pointer-events: none;
      z-index: 2;
    }

    /* ─── VIDEO PLACEHOLDER (quando não há src) ─── */
    .video-placeholder {
      width: 100%;
      padding-top: 56.25%;
      position: relative;
      background: linear-gradient(135deg, #2a1510, #1a0f0a);
    }

    .video-placeholder-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      color: var(--muted);
    }

    .play-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 1px solid rgba(201,169,110,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      transition: all 0.3s ease;
    }

    .video-placeholder-inner p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--muted);
    }
    .video-placeholder-inner small {
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      opacity: 0.6;
    }

    /* ─── CONTROLS HINT ─── */
    .video-hint {
      background: rgba(201,169,110,0.07);
      border: 1px dashed rgba(201,169,110,0.25);
      border-radius: 4px;
      padding: 0.9rem 1.5rem;
      font-size: 0.76rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-align: center;
      max-width: 620px;
      line-height: 1.7;
    }

    /* ─── BACK BUTTON ─── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      color: var(--muted);
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.3s ease;
      margin-top: 1rem;
    }
    .back-btn:hover { color: var(--blush); }
    .back-btn svg { transition: transform 0.3s ease; }
    .back-btn:hover svg { transform: translateX(-4px); }

    /* ─── ANIMATIONS ─── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">

    <!-- HEADER -->
    <div class="page-header">
      <p class="eyebrow">Uma mensagem do coração</p>
      <h1 class="page-title">Com todo o meu <em>amor</em></h1>
      <p class="page-subtitle">Algumas palavras são difíceis de dizer, mas nunca difíceis de sentir.</p>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-icon">♥</div>
      <div class="divider-line"></div>
    </div>

    <!-- VIDEO -->
    <div class="video-wrapper">

      <!--
        ════════════════════════════════════════════
        OPÇÃO 1 — YouTube (recomendado)
        Substitua VIDEO_ID pelo ID do seu vídeo.
        Exemplo: https://www.youtube.com/watch?v=dQw4w9WgXcQ → VIDEO_ID = dQw4w9WgXcQ

        <div class="video-ratio">
          <iframe
            src="https://www.youtube.com/embed/VIDEO_ID?rel=0&showinfo=0&color=white"
            title="Mensagem especial para a minha mãe"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>
        ════════════════════════════════════════════

        OPÇÃO 2 — Arquivo de vídeo local
        <div class="video-ratio">
          <video controls>
            <source src="mensagem.mp4" type="video/mp4" />
          </video>
        </div>
        ════════════════════════════════════════════
      -->

      <!-- PLACEHOLDER — remova quando adicionar o vídeo real -->
      <div class="video-placeholder">
        <div class="video-placeholder-inner">
          <div class="play-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
          </div>
          <p>Seu vídeo especial aqui</p>
          <small>Abra video.html e substitua o placeholder pelo embed do YouTube ou arquivo de vídeo</small>
        </div>
      </div>

    </div>

    
    <!-- VOLTAR -->
    <a href="index.html" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      Voltar para a homenagem
    </a>

  </div>

</body>
</html>
